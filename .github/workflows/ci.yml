name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Giá trị chỉ dùng cho CI — không phải bí mật thật.
  SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
  DEBUG: "0"
  ALLOWED_HOSTS: localhost,127.0.0.1
  FIELD_ENCRYPTION_KEY: ZmFrZS10ZXN0LWtleS1mb3ItZmVybmV0LTMyYnl0ZXM9PQ==

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.9.10
      - run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: annotahub
          POSTGRES_USER: annotahub_user
          POSTGRES_PASSWORD: ci-password
        options: >-
          --health-cmd "pg_isready -U annotahub_user -d annotahub"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: pip install -r requirements-dev.txt

      - name: Kiểm tra migration không bị thiếu
        env:
          DATABASE_URL: postgres://annotahub_user:ci-password@localhost:5432/annotahub
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py makemigrations --check --dry-run

      - name: Chạy test
        run: python manage.py test comments --settings=annotahub.settings_test -v 2

      - name: Kiểm tra cấu hình triển khai
        env:
          DATABASE_URL: postgres://annotahub_user:ci-password@localhost:5432/annotahub
          REDIS_URL: redis://localhost:6379/0
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          SECURE_SSL_REDIRECT: "1"
          SECURE_HSTS_SECONDS: "31536000"
        run: |
          # Với cấu hình HTTPS đầy đủ, check --deploy phải sạch hoàn toàn.
          python manage.py check --deploy --fail-level WARNING

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t annotahub-app:ci .
      - name: Smoke test — Django check trong image
        run: |
          docker run --rm \
            -e SECRET_KEY="$SECRET_KEY" -e DEBUG=0 \
            -e ALLOWED_HOSTS=localhost \
            --entrypoint python annotahub-app:ci manage.py check
