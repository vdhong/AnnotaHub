{% extends "comments/base.html" %}
{% load i18n %}
{% block title %}{{ code }} — {{ title }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh">
  <div class="text-center" style="max-width:520px">
    <div class="display-1 fw-bold text-muted">{{ code }}</div>
    <h1 class="h4 mb-3">{{ title }}</h1>
    <p class="text-muted">{{ detail }}</p>
    <a href="{% url 'comments:project_list' %}" class="btn btn-primary mt-2">
      <i class="bi bi-house"></i> {% trans "Về trang dự án" %}
    </a>
  </div>
</div>
{% endblock %}
